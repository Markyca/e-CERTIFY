# Add this block to the TOP of:  C:\xampp\apache\conf\extra\httpd-vhosts.conf
# (it must be the first <VirtualHost> in the file)

<VirtualHost *:80>
    ServerName ecertify.local
    # Lets other computers on the office network open it by the server's IP address too
    ServerAlias *
    DocumentRoot "C:/xampp/htdocs/e-certify/public"

    <Directory "C:/xampp/htdocs/e-certify/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
